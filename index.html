<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ドットコムゲーム広場</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    margin:0;
    background:#f2f2f2;
    color:#333;
}

header{
    background:linear-gradient(90deg,#4facfe,#00f2fe);
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    cursor:pointer;
}

.top-buttons{
    display:flex;
    gap:10px;
}

.top-buttons button{
    background:white;
    color:#0984e3;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    font-weight:bold;
}

.search-area{
    text-align:center;
    padding:20px;
}

#searchBar{
    padding:12px;
    width:300px;
    max-width:90%;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:16px;
}

.sort-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:15px 0;
    flex-wrap:wrap;
}

.sort-buttons button{
    background:white;
    border:1px solid #ddd;
    padding:9px 14px;
    border-radius:6px;
}

#registerForm{
    display:none;
    padding:20px;
    background:white;
    max-width:900px;
    margin:0 auto 20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

#registerForm input,
#registerForm textarea{
    width:100%;
    margin-bottom:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

.code-input{
    min-height:150px;
    background:#202124;
    color:white;
    font-family:monospace;
}

.register-button{
    background:#00b894;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
    align-items:flex-start;
}

.game-card{
    background:white;
    width:260px;
    margin:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    overflow:hidden;
    position:relative;
    transition:.3s;
}

.game-card:hover{
    transform:translateY(-5px);
}

.game-card img{
    width:100%;
    height:150px;
    object-fit:cover;
    background:#ddd;
}

.game-info{
    padding:15px;
}

.game-title{
    font-weight:bold;
    margin-bottom:8px;
    font-size:18px;
}

.game-desc{
    font-size:14px;
    color:#555;
    min-height:40px;
}

.play-button{
    display:block;
    text-align:center;
    background:#4facfe;
    color:white;
    text-decoration:none;
    padding:10px;
    margin:10px;
    border-radius:5px;
}

.like-btn{
    margin:5px;
    background:#ff7675;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
}

.edit-btn{
    margin:5px;
    background:#0984e3;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
}

.share-btn{
    margin:5px;
    background:#636e72;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
}

.recommend-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:#ffeaa7;
    color:#2d3436;
    border:none;
    padding:5px 8px;
    border-radius:5px;
    font-weight:bold;
}

.message{
    text-align:center;
    font-size:18px;
    color:#555;
    padding:30px;
}

@media(max-width:600px){
    header{
        font-size:18px;
        padding:15px;
    }

    .game-card{
        width:calc(100% - 30px);
        max-width:350px;
    }
}
</style>
</head>

<body>

<header>
    <div>ドットコムゲーム広場</div>

    <div class="top-buttons">
        <button onclick="toggleRegister()">
            🎮 ゲーム登録
        </button>
    </div>
</header>

<div class="search-area">

    <input
        type="text"
        id="searchBar"
        placeholder="ゲームを検索..."
    >

    <div class="sort-buttons">
        <button onclick="alert('ランキング機能は次の手順で追加します')">
            🏆 ランキング順
        </button>

        <button onclick="alert('おすすめ機能は次の手順で追加します')">
            ⭐ おすすめ順
        </button>

        <button onclick="alert('新着順')">
            🆕 新着順
        </button>
    </div>

</div>

<div id="registerForm">

    <h2>🎮 ゲーム登録</h2>

    <input
        type="text"
        id="name"
        placeholder="ゲーム名"
    >

    <input
        type="text"
        id="image"
        placeholder="画像URL"
    >

    <textarea
        id="desc"
        placeholder="ゲームの説明"
    ></textarea>

    <h3>HTML</h3>

    <textarea
        id="htmlCode"
        class="code-input"
        placeholder="<h1>ゲーム</h1>"
    ></textarea>

    <h3>CSS</h3>

    <textarea
        id="cssCode"
        class="code-input"
        placeholder="body { background: black; }"
    ></textarea>

    <h3>JavaScript</h3>

    <textarea
        id="jsCode"
        class="code-input"
        placeholder="console.log('ゲーム開始');"
    ></textarea>

    <button
        class="register-button"
        onclick="registerGame()"
    >
        登録する
    </button>

</div>

<div class="container" id="gameContainer"></div>

<div id="noResult" class="message">
    まだゲームがありません。
</div>


<script>

function toggleRegister(){

    const form =
        document.getElementById("registerForm");

    if(form.style.display === "none" ||
       form.style.display === ""){

        form.style.display = "block";

    }else{

        form.style.display = "none";

    }
}


function registerGame(){

    alert(
        "ゲーム登録機能は、Supabaseとの接続が完了した後に有効になります！"
    );

}

</script>

</body>
</html>
